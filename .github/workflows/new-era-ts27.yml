name: NEW-ERA TS-27 C4 validation
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ts27-c4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S NEW_ERA_IMPLEMENTATION/test_server -B build/ts27 -DCMAKE_BUILD_TYPE=Release
      - name: Build TS-27
        run: |
          set +e
          cmake --build build/ts27 --config Release --target ts27_c4_server_rx_loopback --parallel 2 2>&1 | tee build-ts27.log
          rc=${PIPESTATUS[0]}
          exit $rc
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts27-build-log
          path: build-ts27.log
      - name: Run TS-27
        run: |
          set +e
          build/ts27/ts27_c4_server_rx_loopback 2>&1 | tee run-ts27.log
          rc=${PIPESTATUS[0]}
          exit $rc
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts27-run-log
          path: run-ts27.log
